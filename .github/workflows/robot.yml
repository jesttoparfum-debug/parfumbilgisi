name: Parfüm robotu (Wikidata)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = sadece dene, veritabanına yazma"
        default: "1"
  schedule:
    - cron: "17 3 * * 1" # her pazartesi 03:17 UTC

jobs:
  robot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Robotu çalıştır
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: node scripts/robot/wikidata.mjs
